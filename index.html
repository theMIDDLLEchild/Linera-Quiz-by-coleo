
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LINERA QUIZ BY COLEO</title>
  <link rel="stylesheet" href="./style.css"/>
  <script src="./app.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo"><img src="linera_logo.png" alt="Linera logo"/></div>
      <div class="brand">Linera</div>
      <div class="titlebar">LINERA QUIZ BY COLEO</div>
    </div>
  </header>

  <main>
    <section class="card" id="welcome">
      <h2>Ready?</h2>
      <p class="intro">You’ll get <strong>20 random questions</strong> from a bank of 50. Each correct answer is worth <strong>5 points</strong>. Final score is out of 100.</p>
      <div class="controls">
        <button id="startBtn" type="button">Start Quiz</button>
      </div>
    </section>

    <section class="card hidden" id="quiz">
      <div id="question" class="question"></div>
      <div id="answers" class="answers"></div>
      <div class="meta">
        <div id="progress">Question 1 / 20</div>
        <div id="scoreSoFar">Score: 0/100</div>
      </div>
    </section>

    <section class="card hidden" id="result">
      <div>Final score</div>
      <div id="finalScore" class="score"></div>
      <p id="summary" class="intro"></p>
      <div class="controls">
        <button id="restartBtn" class="secondary" type="button">Restart</button>
      </div>
      <div class="review" id="review">
        <h3>Review Answers</h3>
        <div id="reviewList"></div>
      </div>
    </section>
  </main>
</body>
</html>
