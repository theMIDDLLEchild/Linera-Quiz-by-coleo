
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LINERA QUIZ BY COLEO</title>
  <style>
    :root {
      --linera-red: #D03232;
      --bg: #0d0d0d;
      --card: #161616;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --green: #3fb950;
      --danger: #e55353;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1000px 600px at 50% -20%, rgba(208,50,50,0.15), transparent 60%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header { background: #111; border-bottom: 2px solid var(--linera-red); padding: .6rem 1rem; }
    .header-inner { width: min(1100px, 94vw); margin: 0 auto; display: flex; align-items: center; gap: .8rem; }
    .logo img { width: 40px; height: 40px; display:block; }
    .brand { font-weight: 800; letter-spacing: .3px; font-size: 1.05rem; }
    .titlebar { margin-left: auto; font-weight: 700; color: var(--linera-red); }
    .wrap { width: min(1100px, 92vw); margin: 2rem auto; display: grid; grid-template-columns: 1fr 340px; gap: 1.25rem; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
    .card { background: linear-gradient(180deg, #1b1b1b, #141414); border: 1px solid #2a2a2a; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); padding: clamp(1rem, 2.5vw, 1.75rem); }
    .intro { color: var(--muted); margin-top: .25rem; }
    .controls { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; margin: 1rem 0 1.5rem; }
    button { background: transparent; border: 2px solid var(--linera-red); color: var(--text); padding: .8rem 1rem; border-radius: 10px; cursor: pointer; transition: .2s ease; font-weight: 600; }
    button.primary { background: var(--linera-red); border-color: var(--linera-red); }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(208,50,50,.25); }
    .question { font-size: 1.1rem; margin: .25rem 0 1rem; }
    .answers { display: grid; gap: .6rem; }
    .answers button { text-align: left; background: #1e1e1e; border: 1px solid #2a2a2a; padding: .85rem 1rem; border-radius: 10px; font-weight: 500; }
    .answers button:hover { background: #262626; border-color: #3a3a3a; }
    .meta { margin-top: 1rem; color: var(--muted); display:flex; gap:.75rem; justify-content:space-between; }
    .hidden { display:none !important; }
    .result { text-align:center; padding: 2rem 1rem; }
    .score { font-size: clamp(1.4rem, 3.5vw, 2rem); color: var(--linera-red); font-weight:800; margin:.25rem 0 .75rem; }
    .name-entry { display:flex; gap:.5rem; justify-content:center; margin-top:.5rem; flex-wrap:wrap; }
    .name-entry input { padding:.6rem .8rem; border-radius:8px; border:1px solid #2a2a2a; background:#1a1a1a; color:var(--text); min-width:200px; }
    .sidebar .card { position: sticky; top: 1rem; }
    .sidebar h3 { margin:0 0 .5rem; font-size:1.05rem; }
    .lb-list { list-style:none; padding:0; margin:0; }
    .lb-item { display:flex; justify-content:space-between; align-items:center; padding:.6rem .75rem; border:1px solid #2a2a2a; background:#171717; border-radius:10px; margin-bottom:.5rem; }
    .lb-rank { color:var(--muted); font-weight:700; margin-right:.5rem; }
    .lb-name { font-weight:700; }
    .lb-score { color:var(--green); font-weight:800; }
    .review { margin-top: 1rem; }
    .review h3 { margin: 1.2rem 0 .6rem; }
    .rev-item { border:1px solid #2a2a2a; background:#171717; border-radius:10px; padding:.75rem; margin-bottom:.5rem; }
    .rev-q { font-weight:700; margin-bottom:.4rem; }
    .rev-a.correct { color: var(--green); }
    .rev-a.wrong { color: var(--danger); }
    .streak { display:flex; align-items:center; gap:.45rem; font-weight:700; color:#ffd166; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" title="Linera"><img src="linera_logo.png" alt="Linera logo"/></div>
      <div class="brand">Linera</div>
      <div class="titlebar">LINERA QUIZ BY COLEO</div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="streak" id="streakBar">🔥 Streak: <span id="streakCount">0</span> day(s)</div>
      <p class="intro">Each round serves <strong>20 random questions</strong> from a bank of 50. Score is out of <strong>100</strong> (5 pts each).</p>
      <div class="controls">
        <button id="startBtn" class="primary">Start Quiz</button>
        <button id="restartBtn" class="hidden">Restart</button>
        <span id="progress" class="intro"></span>
      </div>

      <div id="quizArea" class="hidden">
        <div id="question" class="question"></div>
        <div id="answers" class="answers"></div>
        <div class="meta">
          <div id="qIndex"></div>
          <div id="scoreSoFar"></div>
        </div>
      </div>

      <div id="resultArea" class="result hidden">
        <div>Final score</div>
        <div class="score" id="finalScore"></div>
        <div id="summary" class="intro"></div>
        <div class="name-entry" id="nameEntry">
          <input id="playerName" placeholder="Enter name or handle"/>
          <button id="saveScoreBtn" class="primary">Save to Leaderboard</button>
          <button id="shareBtn" class="primary hidden">Share on X</button>
        </div>
        <div id="reviewArea" class="review hidden">
          <h3>Review Answers</h3>
          <div id="reviewList"></div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <section class="card">
        <h3>Leaderboard (local)</h3>
        <ul id="leaderboard" class="lb-list"></ul>
        <p class="intro">Stored in your browser via <code class="badge">localStorage</code>. Top 10 by score.</p>
      </section>
    </aside>
  </main>

  <footer>Built with ❤️ for Linera learners. <code class="badge">#D03232</code></footer>

  <script>
    const QUESTION_POOL = [{"q": "What makes Linera different from most blockchains?", "a": ["It gives each user/app their own microchain", "It relies on a single global mempool", "It only runs as a Layer 2"], "c": 0}, {"q": "In simple words, what is a microchain?", "a": ["Your own mini-blockchain for your app or account", "A random shard of another network", "A sidechain bridge"], "c": 0}, {"q": "Why do microchains help AI agents?", "a": ["They avoid shared queues so agents don’t block each other", "They run models on-chain", "They remove fees entirely"], "c": 0}, {"q": "What experience does Linera aim to deliver for users?", "a": ["Real‑time, snappy interactions", "Batch settlements once a day", "Minutes-long confirmation times"], "c": 0}, {"q": "What does 'elastic validator scaling' mean for users?", "a": ["The network adds capacity when apps get busy", "Validators change the token price", "Users must select validators manually"], "c": 0}, {"q": "Which testnet name is associated with the Game of Life theme?", "a": ["Conway", "Archimedes", "Ada"], "c": 0}, {"q": "Why is the testnet called 'Conway'?", "a": ["After John Horton Conway, whose simple rules create complex behavior", "After the city where it launched", "After a consensus algorithm"], "c": 0}, {"q": "What’s the big idea behind Linera’s architecture?", "a": ["Many small chains that talk only when needed", "One huge chain shared by everyone", "Only off-chain databases"], "c": 0}, {"q": "How does Linera keep one busy app from slowing down others?", "a": ["Isolated execution per microchain", "Higher gas fees for all", "Longer block times"], "c": 0}, {"q": "What does 'sub‑second latency' feel like to a user?", "a": ["App actions feel immediate", "You wait for several minutes", "You need to refresh the page"], "c": 0}, {"q": "For DeFi users, why does predictable speed matter?", "a": ["Trades and liquidations trigger when they should", "It’s only cosmetic", "It makes price charts brighter"], "c": 0}, {"q": "For games, why are microchains useful?", "a": ["Burst traffic won’t jam other players or apps", "They disable multiplayer features", "They require mining GPUs"], "c": 0}, {"q": "What does a Linera wallet sign by design?", "a": ["Blocks for your microchain", "Only off-chain messages", "NFT images"], "c": 0}, {"q": "Long-term, how should everyday users manage their wallet?", "a": ["Through a browser extension", "Only in terminal windows", "By sending emails"], "c": 0}, {"q": "What’s the 'agentic web' in this context?", "a": ["Humans + AI agents acting in real time", "A private social network", "Another word for cloud hosting"], "c": 0}, {"q": "Why do traditional blockchains struggle with AI agents?", "a": ["Agents create thousands of small actions that clog shared queues", "Agents can’t hold keys", "Agents dislike cryptography"], "c": 0}, {"q": "How do microchains communicate when needed?", "a": ["By passing certified messages", "Through screenshots", "By copying entire databases"], "c": 0}, {"q": "What happens when one microchain gets very busy?", "a": ["Validators can scale to handle it", "All chains slow down equally", "The network pauses"], "c": 0}, {"q": "What’s a simple benefit users notice first?", "a": ["Smooth, consistent interactions", "Mining rewards increase", "No more passwords"], "c": 0}, {"q": "Linera’s roadmap names are inspired by:", "a": ["Mathematicians and computing pioneers", "Popular cities", "Constellation names only"], "c": 0}, {"q": "Which phase focuses on developer experience?", "a": ["Babbage", "Maxwell", "Ada"], "c": 0}, {"q": "Which phase focuses on elastic scaling?", "a": ["Maxwell", "Archimedes", "Babbage"], "c": 0}, {"q": "Which phase brings governance & decentralization?", "a": ["Ada", "Babbage", "Conway"], "c": 0}, {"q": "Which early phase laid protocol foundations?", "a": ["Archimedes", "Maxwell", "Ada"], "c": 0}, {"q": "What’s a quick way to describe Linera to friends?", "a": ["Personal chains that scale like cloud apps", "A meme coin network", "A mining pool"], "c": 0}, {"q": "What’s the point of Linera’s 'points' programs in testnet?", "a": ["Make learning and testing more engaging", "Only reward GPU miners", "Hide fees"], "c": 0}, {"q": "How does Linera help social/coordination apps?", "a": ["Keeps messages fast without global congestion", "Requires weekly maintenance", "Forces global ordering of every like"], "c": 0}, {"q": "What kind of wallets can connect during Conway demos?", "a": ["Popular wallets via integrations (e.g., MetaMask, Phantom, Coinbase)", "Only a custom desktop wallet", "Paper wallets only"], "c": 0}, {"q": "If an agent manages your account on Linera, what’s reassuring?", "a": ["You still approve actions through your wallet", "The agent needs your seed phrase", "Everything runs on a public server"], "c": 0}, {"q": "What’s special about Linera’s approach to messages between chains?", "a": ["They’re certified, so receivers can verify them", "They’re anonymous gossip only", "They require a centralized relay"], "c": 0}, {"q": "When people say 'real‑time blockchain' here, they mean:", "a": ["Interactive apps respond almost instantly", "Blocks are produced once a day", "Only streaming video is supported"], "c": 0}, {"q": "For new users, fees on Linera aim to be:", "a": ["Predictable and reasonable", "Randomly spiking", "Paid in physical cash"], "c": 0}, {"q": "Linera’s design is most similar to what in Web2?", "a": ["Cloud-style horizontal scaling", "Single-threaded desktop apps", "Dial‑up modems"], "c": 0}, {"q": "Why is isolation important for fairness?", "a": ["Heavy usage in one app doesn’t punish others", "It increases speculation", "It hides prices"], "c": 0}, {"q": "What does 'end‑to‑end under a second' imply?", "a": ["User presses a button and sees a confirmed result quickly", "Only validators benefit", "It requires special hardware at home"], "c": 0}, {"q": "What’s a good use case beyond DeFi and games?", "a": ["Agent scheduling & on-chain coordination", "DVD rentals", "Offline mailing lists"], "c": 0}, {"q": "How does Linera handle sudden surges (e.g., mints or events)?", "a": ["Elastic capacity per chain absorbs spikes", "It bans new users", "It slows the whole network"], "c": 0}, {"q": "What’s the vibe of Linera’s branding?", "a": ["Minimal, geometric, red-and-white", "Neon gradients and mascots", "Hand‑drawn pastel doodles"], "c": 0}, {"q": "What’s the advantage of 'talk only when needed' between chains?", "a": ["Lower overhead and faster local actions", "More spam by default", "Hard forks every week"], "c": 0}, {"q": "Why might creators like microchains?", "a": ["They get dedicated state & logic for their app", "They can’t launch tokens", "They must share configs globally"], "c": 0}, {"q": "For users joining testnet, what’s typically encouraged?", "a": ["Try demo apps, share feedback, join weekly prompts", "Run a mining rig", "Send random large transactions"], "c": 0}, {"q": "Who founded Linera?", "a": ["Mathieu Baudet, PhD", "Vitalik Buterin", "Gavin Wood"], "c": 0}, {"q": "Which investor backed Linera early?", "a": ["a16z crypto", "Sequoia China only", "No investors"], "c": 0}, {"q": "What’s a simple description of certified messages for users?", "a": ["Receipts that prove a message is valid", "Private DMs", "Coupons for gas"], "c": 0}, {"q": "If your app is 'bursty', what happens on Linera?", "a": ["Your chain handles it without jamming others", "Everyone’s fees go up together", "You must pause the app"], "c": 0}, {"q": "How does Linera relate to the 'AI era'?", "a": ["It’s designed so human + AI activity can run smoothly", "It replaces all AI models", "It bans automation"], "c": 0}, {"q": "What’s a common community hashtag for Conway boards?", "a": ["#MyConwayBoard", "#OnlyLayer2", "#GasFeesFTW"], "c": 0}, {"q": "What kind of real-world events does Linera sometimes sponsor?", "a": ["Music/tech festivals with demos", "Only finance conferences", "Private invite-only dinners"], "c": 0}, {"q": "At events, what was a playful perk seen at Linera Court?", "a": ["Retro swag and free snow-cones", "On-site GPU mining", "Paid parking vouchers"], "c": 0}, {"q": "What’s the main promise to everyday users?", "a": ["Fast, reliable apps that don’t get stuck in traffic", "Guaranteed price increases", "No need for wallets anymore"], "c": 0}, {"q": "How should builders think about Linera apps?", "a": ["Like cloud apps with on-chain guarantees", "Like static websites only", "Like offline spreadsheets"], "c": 0}];

    const TOTAL_PER_RUN = 20;
    const POINTS_PER_Q = 5;

    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const quizArea = document.getElementById('quizArea');
    const questionEl = document.getElementById('question');
    const answersEl = document.getElementById('answers');
    const qIndexEl = document.getElementById('qIndex');
    const scoreSoFarEl = document.getElementById('scoreSoFar');
    const resultArea = document.getElementById('resultArea');
    const finalScoreEl = document.getElementById('finalScore');
    const summaryEl = document.getElementById('summary');
    const progressEl = document.getElementById('progress');
    const nameEntry = document.getElementById('nameEntry');
    const playerNameInput = document.getElementById('playerName');
    const saveScoreBtn = document.getElementById('saveScoreBtn');
    const shareBtn = document.getElementById('shareBtn');
    const leaderboardEl = document.getElementById('leaderboard');
    const reviewArea = document.getElementById('reviewArea');
    const reviewList = document.getElementById('reviewList');
    const streakCount = document.getElementById('streakCount');

    let selectedSet = [];
    let current = 0;
    let score = 0;
    let answersLog = [];

    const LB_KEY = 'linera_quiz_lb_v2';
    const STREAK_KEY = 'linera_quiz_streak_v1';

    function getToday() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }
    function loadStreak() {
      try { const data = JSON.parse(localStorage.getItem(STREAK_KEY)) || null; return data || { count:0, last:0 }; } catch(e) { return { count:0, last:0 }; }
    }
    function saveStreak(obj) { localStorage.setItem(STREAK_KEY, JSON.stringify(obj)); }
    function updateStreakOnFinish() {
      const today = getToday();
      const st = loadStreak();
      const oneDay = 24*60*60*1000;
      if (st.last === today) { return st.count; }
      else if (st.last === today - oneDay) { const n = (st.count || 0) + 1; saveStreak({ count:n, last:today }); return n; }
      else { saveStreak({ count:1, last:today }); return 1; }
    }
    function renderStreak() { const st = loadStreak(); streakCount.textContent = st.count || 0; }
    renderStreak();

    function getLeaderboard() { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch (e) { return []; } }
    function saveLeaderboard(lb) { localStorage.setItem(LB_KEY, JSON.stringify(lb)); }
    function addToLeaderboard(name, score) {
      const lb = getLeaderboard();
      lb.push({ name, score, ts: Date.now() });
      lb.sort((a,b) => b.score - a.score || a.ts - b.ts);
      saveLeaderboard(lb.slice(0,10));
      renderLeaderboard();
    }
    function renderLeaderboard() {
      const lb = getLeaderboard();
      leaderboardEl.innerHTML = '';
      if (lb.length === 0) {
        const li = document.createElement('li');
        li.className = 'lb-item';
        li.innerHTML = '<span class="lb-name">No scores yet</span><span class="lb-score">—</span>';
        leaderboardEl.appendChild(li);
        return;
      }
      lb.forEach((row, idx) => {
        const li = document.createElement('li');
        li.className = 'lb-item';
        li.innerHTML = '<span><span class="lb-rank">#'+(idx+1)+'</span><span class="lb-name">'+escapeHtml(row.name || 'Anon')+'</span></span>' +
                       '<span class="lb-score">'+row.score+'</span>';
        leaderboardEl.appendChild(li);
      });
    }
    function escapeHtml(str) { return String(str).replace(/[&<>"'`=\/]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;','\':'&#x5C;'}[s])); }
    renderLeaderboard();

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickRandomQuestions() {
      const pool = [...QUESTION_POOL];
      shuffleArray(pool);
      return pool.slice(0, TOTAL_PER_RUN).map(q => ({
        question: q.q,
        answers: shuffleAnswers(q.a, q.c),
        correctIndexOriginal: q.c,
        originalAnswers: q.a
      }));
    }

    function shuffleAnswers(ans, correctIndex) {
      const arr = ans.map((text, idx) => ({ text, isCorrect: idx === correctIndex, originalIndex: idx }));
      shuffleArray(arr);
      return arr;
    }

    function startQuiz() {
      score = 0;
      current = 0;
      answersLog = [];
      selectedSet = pickRandomQuestions();
      startBtn.classList.add('hidden');
      restartBtn.classList.add('hidden');
      resultArea.classList.add('hidden');
      nameEntry.classList.add('hidden');
      shareBtn.classList.add('hidden');
      reviewArea.classList.add('hidden');
      quizArea.classList.remove('hidden');
      progressEl.textContent = `Pulled ${TOTAL_PER_RUN} from a bank of ${QUESTION_POOL.length}`;
      renderQuestion();
    }

    function renderQuestion() {
      const q = selectedSet[current];
      questionEl.textContent = q.question;
      answersEl.innerHTML = '';
      q.answers.forEach((opt) => {
        const btn = document.createElement('button');
        btn.textContent = opt.text;
        btn.addEventListener('click', () => handleAnswer(opt));
        answersEl.appendChild(btn);
      });
      qIndexEl.textContent = `Question ${current + 1} / ${TOTAL_PER_RUN}`;
      scoreSoFarEl.textContent = `Score: ${score}/${TOTAL_PER_RUN * POINTS_PER_Q}`;
    }

    function handleAnswer(opt) {
      const isCorrect = opt.isCorrect;
      if (isCorrect) { score += POINTS_PER_Q; }
      answersLog.push({
        q: selectedSet[current].question,
        chosen: opt.text,
        correct: selectedSet[current].answers.find(a => a.isCorrect).text,
        ok: isCorrect
      });
      Array.from(answersEl.children).forEach(b => b.disabled = true);
      setTimeout(() => {
        current++;
        if (current < TOTAL_PER_RUN) { renderQuestion(); } else { endQuiz(); }
      }, 250);
    }

    function endQuiz() {
      quizArea.classList.add('hidden');
      resultArea.classList.remove('hidden');
      finalScoreEl.textContent = `${score} / ${TOTAL_PER_RUN * POINTS_PER_Q}`;
      const pct = Math.round((score / (TOTAL_PER_RUN * POINTS_PER_Q)) * 100);
      summaryEl.textContent = `You answered ${score/POINTS_PER_Q} out of ${TOTAL_PER_RUN} correctly (${pct}%).`;
      renderReview();
      reviewArea.classList.remove('hidden');
      updateStreakOnFinish();
      renderStreak();
      nameEntry.classList.remove('hidden');
      restartBtn.classList.remove('hidden');
      startBtn.classList.remove('hidden');
      startBtn.textContent = 'Start Again';
      shareBtn.classList.remove('hidden');
    }

    function renderReview() {
      reviewList.innerHTML = '';
      answersLog.forEach((row, i) => {
        const div = document.createElement('div');
        div.className = 'rev-item';
        div.innerHTML = `<div class="rev-q">${i+1}. ${escapeHtml(row.q)}</div>
                         <div class="rev-a ${row.ok ? 'correct' : 'wrong'}">Your answer: ${escapeHtml(row.chosen)}</div>
                         <div class="rev-a correct">Correct answer: ${escapeHtml(row.correct)}</div>`;
        reviewList.appendChild(div);
      });
    }

    saveScoreBtn.addEventListener('click', () => {
      const name = playerNameInput.value.trim() || 'Anon';
      addToLeaderboard(name, score);
      playerNameInput.value = '';
    });

    shareBtn.addEventListener('click', () => {
      const text = `I just scored ${score}/${TOTAL_PER_RUN * POINTS_PER_Q} on the Linera Quiz by Coleo! ⚡\nPlay here: https://linera-quiz-by-coleo.vercel.app/`;
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    });

    startBtn.addEventListener('click', startQuiz);
    restartBtn.addEventListener('click', startQuiz);
  </script>
</body>
</html>
